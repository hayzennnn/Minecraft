name: Update Minecraft textures

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-textures:
    if: ${{ !startsWith(github.event.head_commit.message, 'Automated texture update') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace block and mineral images inside the site ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="gestion-et-administration-e-commerce.zip"
          WORK="_site_unpack"
          OUT="_site_repacked.zip"

          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK"
          unzip -q "$ZIP_FILE" -d "$WORK"

          python3 <<'PY'
          from pathlib import Path
          import hashlib, math, random, struct, zlib, subprocess, re

          root = Path("_site_unpack")

          names = [
              "stone","cobblestone","mossy","dirt","grass","sand","gravel","clay",
              "snow","ice","packed_ice","blue_ice","glass","brick","terracotta",
              "concrete","basalt","blackstone","deepslate","obsidian","netherrack",
              "nether","soul","end_stone","purpur","quartz","amethyst",
              "coal","iron","gold","diamond","emerald","redstone","lapis","copper",
              "ore","raw_iron","raw_gold","raw_copper"
          ]

          image_exts = {".png", ".jpg", ".jpeg", ".webp"}
          exclude_terms = {
              "logo","favicon","banner","background","header","footer","icon",
              "avatar","screenshot","preview","thumbnail","ui","button"
          }

          def is_candidate(p: Path) -> bool:
              if p.suffix.lower() not in image_exts:
                  return False
              s = str(p).lower()
              if any(x in s for x in exclude_terms):
                  return False
              return any(x in p.name.lower() or x in s for x in names)

          def color_for(label):
              l = label.lower()
              mapping = [
                  ("diamond",(74,220,235)), ("emerald",(50,190,90)),
                  ("gold",(245,205,55)), ("iron",(205,205,200)),
                  ("copper",(196,105,55)), ("redstone",(185,45,45)),
                  ("lapis",(55,85,195)), ("coal",(45,45,48)),
                  ("amethyst",(150,85,190)), ("obsidian",(35,30,48)),
                  ("quartz",(235,230,215)), ("sand",(220,195,135)),
                  ("grass",(90,165,65)), ("dirt",(135,88,52)),
                  ("deepslate",(65,70,78)), ("stone",(125,128,125)),
                  ("cobblestone",(105,108,105)), ("netherrack",(145,72,68)),
                  ("blackstone",(55,52,58)), ("snow",(235,240,245)),
                  ("ice",(145,205,240)), ("brick",(155,72,60)),
                  ("clay",(165,160,150))
              ]
              for k, c in mapping:
                  if k in l:
                      return c
              return (125,128,125)

          def png_bytes(w, h, pixels):
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  raw.extend(bytes(pixels[y]))
              def chunk(tag, data):
                  return struct.pack(">I",len(data))+tag+data+struct.pack(">I",zlib.crc32(tag+data)&0xffffffff)
              sig = b"\x89PNG\r\n\x1a\n"
              ihdr = struct.pack(">IIBBBBB",w,h,8,2,0,0,0)
              return sig + chunk(b'IHDR',ihdr) + chunk(b'IDAT',zlib.compress(bytes(raw),9)) + chunk(b'IEND',b'')

          def make_texture(path: Path):
              try:
                  probe = subprocess.check_output(
                      ["identify","-format","%w %h",str(path)],
                      text=True, stderr=subprocess.DEVNULL
                  ).strip().split()
                  w, h = int(probe[0]), int(probe[1])
              except Exception:
                  w = h = 16

              w = max(16, min(w, 512))
              h = max(16, min(h, 512))

              label = path.name
              base = color_for(label)
              seed = int(hashlib.sha256(str(path).encode()).hexdigest()[:16],16)
              rng = random.Random(seed)

              # Work on a small pixel grid to preserve a Minecraft-like pixel-art feel.
              sw = 16
              sh = 16
              pixels = []
              for y in range(sh):
                  row = bytearray()
                  for x in range(sw):
                      n = rng.randint(-14,14)
                      r = max(0,min(255,base[0]+n))
                      g = max(0,min(255,base[1]+n))
                      b = max(0,min(255,base[2]+n))
                      row.extend((r,g,b))
                  pixels.append(row)

              l = label.lower()
              is_ore = any(k in l for k in ["ore","diamond","emerald","gold","iron","copper","coal","redstone","lapis"])
              if is_ore:
                  ore = base if any(k in l for k in ["diamond","emerald","gold","iron","copper","coal","redstone","lapis"]) else (220,180,70)
                  bg = (48,50,48) if "deepslate" not in l else (45,48,55)
                  for y in range(sh):
                      for x in range(sw):
                          i = x*3
                          j = y*3
                          n = pixels[y][i]
                          pixels[y][i:i+3] = bytes(max(0,min(255,bg[k] + (n-125)//8)) for k in range(3))
                  for _ in range(8):
                      cx, cy = rng.randrange(sw), rng.randrange(sh)
                      rad = rng.choice([1,1,1,2])
                      for yy in range(max(0,cy-rad), min(sh,cy+rad+1)):
                          for xx in range(max(0,cx-rad), min(sw,cx+rad+1)):
                              if (xx-cx)**2+(yy-cy)**2 <= rad*rad+1:
                                  i = xx*3
                                  j = yy
                                  jitter = rng.randint(-10,10)
                                  pixels[j][i:i+3] = bytes(max(0,min(255,ore[k]+jitter)) for k in range(3))

              # Add subtle edge lighting.
              for x in range(sw):
                  pixels[0][x*3:x*3+3] = bytes(min(255,v+18) for v in pixels[0][x*3:x*3+3])
              for y in range(sh):
                  i = sw*3-3
                  pixels[y][i:i+3] = bytes(max(0,v-16) for v in pixels[y][i:i+3])

              png = png_bytes(sw, sh, pixels)

              # Use ImageMagick to preserve the existing file format and dimensions.
              tmp = path.with_suffix(".generated.png")
              tmp.write_bytes(png)
              try:
                  subprocess.run([
                      "convert", str(tmp), "-filter", "point", "-resize", f"{w}x{h}!",
                      str(path)
                  ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              finally:
                  tmp.unlink(missing_ok=True)

          candidates = [p for p in root.rglob("*") if p.is_file() and is_candidate(p)]
          print(f"Candidate textures: {len(candidates)}")
          for p in candidates:
              make_texture(p)
              print("updated", p)

          Path("_texture_count.txt").write_text(str(len(candidates)))
          PY

          COUNT=$(cat _texture_count.txt)
          if [ "$COUNT" -eq 0 ]; then
            echo "No matching block/mineral image files were found."
            exit 0
          fi

          rm -rf "$OUT"
          (cd "$WORK" && zip -qr "../$OUT" .)
          mv "$OUT" "$ZIP_FILE"

      - name: Commit only the updated ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch _texture_count.txt >/dev/null 2>&1 || true
          rm -f _texture_count.txt
          git add gestion-et-administration-e-commerce.zip
          git rm .github/workflows/update-textures.yml
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "Automated texture update"
          git push
