name: Inspect site archive

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ZIP
        shell: bash
        run: |
          set -e
          mkdir -p _unpack
          unzip -q gestion-et-administration-e-commerce.zip -d _unpack
          echo "=== ROOT ==="
          find _unpack -maxdepth 2 -type f | sort | head -200
          echo "=== IMAGES ==="
          find _unpack -type f | grep -Ei '\.(png|jpe?g|webp|gif|svg)$' | sort > image-list.txt || true
          wc -l image-list.txt
          cat image-list.txt
      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest
          path: image-list.txt
