name: Publish Minecraft site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Next.js project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _unpack
          mkdir -p _unpack
          unzip -q gestion-et-administration-e-commerce.zip -d _unpack
          cd _unpack

          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

          if [ ! -d out ]; then
            echo "Build completed but no 'out' directory was generated."
            echo "next.config.mjs:"
            cat next.config.mjs || true
            exit 1
          fi

          cd ..
          mv _unpack/out _site

          if [ -f "_site/index.html" ] && [ ! -f "_site/404.html" ]; then
            cp "_site/index.html" "_site/404.html"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
